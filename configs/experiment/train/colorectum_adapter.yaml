# @package _global_

carcinoma_roi_t: ${train_data.thresholds.epithelium_roi_t} # for colorectum, we use weak epithelium annotations

datamodule:
  train:
    num_slides: 400 # cannot sample from bigger data (torch limitation)
  val:
    num_slides: 100

trainer:
  val_check_interval: 0.03 # much more tiles per slide - validate more often
  reload_dataloaders_every_n_epochs: 1 # re-sample train slides (num_slides) every epoch
