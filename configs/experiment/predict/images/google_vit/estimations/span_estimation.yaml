# @package _global_

defaults:
  - /callbacks/aggregator_estimation@callbacks
  - /experiment/predict/images/google_vit/base_prostate
  - /data/prostate/mmci/sl_group_1@predict_data
  - _self_

callbacks:
  estimation_callback:
    aggregator_cls_path: ml.aggregators.span.SpanAggregator
    static:
      extent_tile: 224
      stride_tile: 112
      cell_threshold: ${model_data.tile_threshold}
    to_estimate:
      k: [2, 3, 4, 5]

use_case: "K Estimation (Span Aggregator)"
