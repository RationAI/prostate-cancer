# @package _global_

defaults:
  - /callbacks/multi_aggregator_estimation@callbacks
  - _self_

callbacks:
  multi_estimation_callback:
    aggregators:
      mean_pool_max:
        aggregator_cls_path: rationai.mlkit.metrics.MeanPoolMaxAggregator
        static:
          extent_tile: 512
          stride_tile: 256
        to_estimate:
          kernel_size: [1, 2, 3, 4, 5, 6, 7]
      top_k:
        aggregator_cls_path: rationai.mlkit.metrics.TopKAggregator
        static:
          extent_tile: 512
          stride_tile: 256
        to_estimate:
          kernel_size: [1, 2, 3, 4, 5]
          k: [2, 3, 4]
      span:
        aggregator_cls_path: ml.aggregators.span.SpanAggregator
        static:
          extent_tile: 512
          stride_tile: 256
          cell_threshold: ${model_data.tile_threshold}
        to_estimate:
          k: [2, 3, 4, 5]

use_case: "Kernel Size & K Estimation (All Aggregators)"
